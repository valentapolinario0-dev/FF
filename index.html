<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Data Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 5px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: 600;
            color: #333;
        }

        .result-value {
            color: #667eea;
            font-family: monospace;
            word-break: break-all;
        }

        .copy-btn {
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 10px;
        }

        .copy-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 Fake Data Generator</h1>
        <p class="subtitle">Generate realistic fake data for testing purposes</p>

        <form id="generatorForm">
            <div class="form-group">
                <label for="dataType">Select Data Type:</label>
                <select id="dataType" required>
                    <option value="">-- Choose --</option>
                    <option value="name">Full Name</option>
                    <option value="email">Email Address</option>
                    <option value="phone">Phone Number</option>
                    <option value="address">Address</option>
                    <option value="credit-card">Credit Card</option>
                    <option value="ssn">Social Security Number</option>
                    <option value="username">Username</option>
                    <option value="password">Password</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" min="1" max="100" value="1" required>
            </div>

            <button type="submit">Generate Fake Data</button>
        </form>

        <div id="result" class="result">
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        const firstNames = ['James', 'Mary', 'Robert', 'Patricia', 'Michael', 'Jennifer', 'William', 'Linda', 'David', 'Barbara', 'John', 'Susan'];
        const lastNames = ['Smith', 'Johnson', 'Williams', 'Brown', 'Jones', 'Garcia', 'Miller', 'Davis', 'Rodriguez', 'Martinez'];
        const domains = ['gmail.com', 'yahoo.com', 'outlook.com', 'example.com', 'test.com'];
        const streets = ['Main St', 'Oak Ave', 'Elm St', 'Maple Dr', 'Pine Rd', 'Cedar Ln'];
        const cities = ['Springfield', 'Shelbyville', 'Capital City', 'Metropolis', 'Gotham'];
        const states = ['CA', 'NY', 'TX', 'FL', 'PA', 'IL', 'OH', 'GA', 'NC', 'MI'];

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateName() {
            return `${getRandomItem(firstNames)} ${getRandomItem(lastNames)}`;
        }

        function generateEmail() {
            const name = `${getRandomItem(firstNames).toLowerCase()}${Math.floor(Math.random() * 9999)}`;
            return `${name}@${getRandomItem(domains)}`;
        }

        function generatePhone() {
            return `+1-${Math.floor(Math.random() * 900) + 100}-${Math.floor(Math.random() * 900) + 100}-${Math.floor(Math.random() * 9000) + 1000}`;
        }

        function generateAddress() {
            const street = `${Math.floor(Math.random() * 9999) + 1} ${getRandomItem(streets)}`;
            const city = getRandomItem(cities);
            const state = getRandomItem(states);
            const zip = `${Math.floor(Math.random() * 90000) + 10000}`;
            return `${street}, ${city}, ${state} ${zip}`;
        }

        function generateCreditCard() {
            let cc = '4';
            for (let i = 0; i < 15; i++) {
                cc += Math.floor(Math.random() * 10);
            }
            return cc.match(/.{1,4}/g).join(' ');
        }

        function generateSSN() {
            const part1 = Math.floor(Math.random() * 900) + 100;
            const part2 = Math.floor(Math.random() * 90) + 10;
            const part3 = Math.floor(Math.random() * 9000) + 1000;
            return `${part1}-${part2}-${part3}`;
        }

        function generateUsername() {
            const adjectives = ['happy', 'clever', 'quick', 'bright', 'swift'];
            return `${getRandomItem(adjectives)}${getRandomItem(firstNames).toLowerCase()}${Math.floor(Math.random() * 999)}`;
        }

        function generatePassword() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%';
            let pwd = '';
            for (let i = 0; i < 12; i++) {
                pwd += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return pwd;
        }

        function generateData(type) {
            switch(type) {
                case 'name': return generateName();
                case 'email': return generateEmail();
                case 'phone': return generatePhone();
                case 'address': return generateAddress();
                case 'credit-card': return generateCreditCard();
                case 'ssn': return generateSSN();
                case 'username': return generateUsername();
                case 'password': return generatePassword();
                default: return '';
            }
        }

        document.getElementById('generatorForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const type = document.getElementById('dataType').value;
            const quantity = parseInt(document.getElementById('quantity').value);

            const typeLabels = {
                'name': 'Full Name',
                'email': 'Email',
                'phone': 'Phone',
                'address': 'Address',
                'credit-card': 'Credit Card',
                'ssn': 'SSN',
                'username': 'Username',
                'password': 'Password'
            };

            let html = '';
            for (let i = 0; i < quantity; i++) {
                const data = generateData(type);
                html += `
                    <div class="result-item">
                        <div>
                            <div class="result-label">${typeLabels[type]} ${quantity > 1 ? '#' + (i + 1) : ''}</div>
                            <div class="result-value">${data}</div>
                        </div>
                    </div>
                `;
            }

            document.getElementById('resultContent').innerHTML = html;
            document.getElementById('result').classList.add('show');
        });
    </script>
</body>
              </html>
